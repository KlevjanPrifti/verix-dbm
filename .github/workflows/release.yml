name: release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v1.2.0 && git push origin v1.2.0
# A tag containing a hyphen (v1.2.0-rc1) is treated as a pre-release: it gets the
# version image tags but not `latest`, and the GitHub Release is marked prerelease.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release and upload binaries
  packages: write # push the image to GHCR

jobs:
  # Build and push the multi-arch container image to GHCR (the primary deploy
  # artifact: the Dockerfile already produces a static, distroless image).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Cross-compile standalone static binaries and attach them to the GitHub Release.
  # The binary is pure-Go (CGO_ENABLED=0), so every target cross-compiles natively
  # on the runner; the SPA is built once and baked in via go:embed.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: build SPA (embedded, platform-independent)
        run: |
          npm --prefix internal/web/spa ci
          npm --prefix internal/web/spa run build

      - name: build release binaries
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="verix-dbm_${version}_${os}_${arch}"
            echo "::group::build ${name}"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/verix-dbm" ./cmd/server
            tar -C dist -czf "dist/${name}.tar.gz" verix-dbm
            rm dist/verix-dbm
            echo "::endgroup::"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          ls -la dist

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
