{{define "title"}}{{.Conn.Name}}{{end}}
{{define "content"}}
{{$conn := .Conn}}
{{with .Data}}
<div class="workspace">
  <aside class="hud-panel sidebar">
    <h3 class="hud-label">Keyspace</h3>
    <input class="hud-input" type="search" name="match" value="{{.Match}}"
           placeholder="match e.g. seal:*"
           hx-get="/c/{{$conn.ID}}/redis/keys" hx-target="#keylist" hx-trigger="keyup changed delay:300ms"
           hx-include="this">
    <div id="keylist">
      {{template "redisKeys" .}}
    </div>
  </aside>

  <section class="main">
    <div class="hud-panel p-4">
      <h3 class="hud-heading">Value</h3>
      <div id="rvalue"><p class="dim">Select a key to inspect it.</p></div>
    </div>

    <div class="hud-panel p-4">
      <h3 class="hud-heading">Command console {{if $conn.ReadOnly}}<span class="ro">READ-ONLY</span>{{end}}</h3>
      <form hx-post="/c/{{$conn.ID}}/redis/cmd" hx-target="#cmdresult" class="stack">
        <input type="hidden" name="csrf" value="{{$.User.CSRF}}">
        <input class="hud-input code" name="cmd" placeholder="GET seal:session:abc   ·   SCAN 0 MATCH ch:*">
        <div class="row end"><button class="hud-btn-cta" type="submit">Run</button></div>
      </form>
      <div id="cmdresult"></div>
    </div>
  </section>
</div>
{{end}}
{{end}}
